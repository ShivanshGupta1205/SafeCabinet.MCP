[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-guidelines-mcp"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pytest>=9.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
